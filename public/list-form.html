                <ul class="navbar-nav">
                    <li class="nav-item"></li>
                </ul><a class="btn btn-primary btn-lg fw-semibold d-xxl-flex align-items-xxl-center ms-auto" role="button" href="listings.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" class="me-2">
                        <!--! Font Awesome Free 6.4.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2023 Fonticons, Inc. -->

            </div>
        </div>
    </nav>
    <section class="py-4 py-xl-5 min-vh-100">
        <div class="container-fluid d-flex justify-content-center px-5">
            <form class="text-center border rounded border-0 shadow-lg p-5" style="max-width: 700px;">
                <h2 class="fw-bold mb-3">List Your Rental</h2>
                <h5 class="mb-4">Fill out the form below to submit your rental listing</h5>
                <div class="row gy-3 row-cols-1 text-start align-items-end">
                    <div class="col"><label class="form-label" for="title">Title*</label><input class="form-control" type="text" id="title" maxlength="27" required="" name="title" placeholder="Enter a short title for your rental"></div>
                    <div class="col"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" required="" name="description" placeholder="Describe your property, amenities, and features"></textarea></div>
                    <div class="col"><label class="form-label" for="image-1">Image</label><input class="form-control" type="url" inputmode="url" placeholder="image.jpg"></div>
                    <div class="col-md-3"><label class="form-label" for="propertyType">Property Type*</label><select class="form-select" id="propertyType" required="" name="propertyType">
                            <option value="room" selected="">Room</option>
                            <option value="property">Entire property</option>
                        </select></div>
                    <div class="col-md-5"><label class="form-label" for="rentAmount">Rent Amount*</label>
                        <div class="input-group"><span class="input-group-text">$</span><input class="form-control" type="text" id="rentAmount" required="" name="rentAmount" placeholder="0"><span class="input-group-text">/ month</span></div>
                    </div>
                    <div class="col-md-4"><label class="form-label" for="numOfRooms">Number of Rooms*</label><input class="form-control" type="number" id="numOfRooms" min="1" step="1" max="5" required="" value="1" name="numOfRooms"></div>
                    <div class="col"><label class="form-label" for="image-2">Location*</label><input class="form-control" type="text" id="image-2" maxlength="27" required="" name="image" placeholder="City, State"></div>
                    <div class="col">
                        <h5 class="fw-bold">Contact Information</h5>
                    </div>
                    <div class="col"><label class="form-label" for="image">Name*</label><input class="form-control" type="text" id="image" maxlength="27" required="" name="image"></div>
                    <div class="col"><label class="form-label" for="image-3">Email Address*</label><input class="form-control" type="email" inputmode="email"></div>
                    <div class="col"><label class="form-label" for="image-4">Phone Number</label><input class="form-control" type="tel" inputmode="tel" name="contactPhone" placeholder="123-456-7890" maxlength="10"></div>
                    <div class="col text-center"><button class="btn btn-outline-success btn-lg fw-semibold border-3" type="submit">Submit Listing</button></div>
                </div>
            </form>
        </div>
    </section>
    <footer class="text-center">
        <div class="container text-muted py-4 py-lg-5">
            <p class="mb-0">Copyright © 2025 RentalConnect</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
